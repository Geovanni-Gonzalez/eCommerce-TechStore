services:
  postgres:
    image: postgres:17-alpine
    container_name: techstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techstore}
      POSTGRES_USER: ${POSTGRES_USER:-techstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techstore_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - techstore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techstore} -d ${POSTGRES_DB:-techstore}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  techstore_postgres_data:
