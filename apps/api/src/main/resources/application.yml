spring:
  application:
    name: techstore-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/techstore}
    username: ${DB_USERNAME:techstore}
    # Configurar la clave mediante SPRING_DATASOURCE_PASSWORD, nunca en Git.
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# Solo orígenes explícitos; nunca usar "*" junto con cookies.
techstore:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  checkout:
    # Tarifas ilustrativas del prototipo, no cálculo fiscal productivo.
    # FIXED o FREE_OVER_THRESHOLD; el cliente no escoge la estrategia.
    shipping-policy: ${CHECKOUT_SHIPPING_POLICY:FREE_OVER_THRESHOLD}
    shipping-fee-crc: ${CHECKOUT_SHIPPING_FEE_CRC:2500.00}
    free-shipping-threshold-crc: ${CHECKOUT_FREE_SHIPPING_THRESHOLD_CRC:30000.00}
    tax-rate: ${CHECKOUT_TAX_RATE:0.13}
    # BKL-027: TTL 30 min en V9; conciliar cada 60 segundos.
    reservation-expiry-enabled: ${CHECKOUT_RESERVATION_EXPIRY_ENABLED:true}
    reservation-expiry-scan-ms: ${CHECKOUT_RESERVATION_EXPIRY_SCAN_MS:60000}
  payment:
    # DISABLED por defecto. SANDBOX sin red requiere opt-in explícito.
    provider: ${TECHSTORE_PAYMENT_PROVIDER:DISABLED}
    sandbox:
      enabled: ${TECHSTORE_PAYMENT_SANDBOX_ENABLED:false}
      # Solo para demostraciones sin cobros reales; nunca selecciona un pago real.
      outcome: ${TECHSTORE_PAYMENT_SANDBOX_OUTCOME:DECLINED}
      # Únicamente uno de los orígenes permitidos en CORS; sin open redirect.
      redirect-origin: ${TECHSTORE_PAYMENT_SANDBOX_REDIRECT_ORIGIN:http://localhost:3000}
    webhook:
      # BKL-038: SOLO callback simulado. Apagado por defecto.
      enabled: ${TECHSTORE_PAYMENT_WEBHOOK_ENABLED:false}
      # Exigir secreto >= 32 bytes desde entorno (no almacenar ni imprimir).
      secret: ${TECHSTORE_PAYMENT_WEBHOOK_SECRET:}

# Exponer únicamente la salud; no divulgar detalles internos en HTTP.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
