name: TechStore CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

# Las verificaciones solo necesitan leer el repositorio.
permissions:
  contents: read

# Cancela ejecuciones anteriores del mismo PR/rama para ahorrar tiempo.
concurrency:
  group: techstore-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend - lint, tipos, contrato, build y smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Obtener código
        uses: actions/checkout@v7

      - name: Preparar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Comprobar archivos Git y secretos BKL-070
        run: |
          node --test scripts/ci/check-secret-files.test.mjs
          node scripts/ci/check-secret-files.mjs

      - name: Validar sintaxis de runbooks operativos BKL-061
        run: |
          bash -n scripts/ops/backup-postgres.sh
          bash -n scripts/ops/check-health.sh

      - name: Probar políticas de configuración staging BKL-060
        run: node --test scripts/ops/validate-staging-config.test.mjs

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Revisar ESLint
        run: npm run lint:web

      - name: Comprobar tipos TypeScript
        run: npm run typecheck:web

      - name: Validar contrato OpenAPI
        run: npm run validate:api-contract

      - name: Probar contrato OpenAPI
        run: npm run test:api-contract

      - name: Probar clasificación de resultados de pago confiables
        run: node --experimental-strip-types --test apps/web/src/lib/payment-result.test.mjs

      - name: Probar historial de pedidos y controles de privacidad BKL-043
        run: node --experimental-strip-types --test apps/web/src/lib/order-history.test.mjs

      - name: Probar catálogo y detalle BKL-019
        run: node --experimental-strip-types --test apps/web/src/lib/catalog.test.mjs

      - name: Probar registro y roles BKL-017
        run: node --experimental-strip-types --test apps/web/src/lib/auth.test.mjs

      - name: Probar contrato del carrito visual BKL-029
        run: node --experimental-strip-types --test apps/web/src/lib/cart.test.mjs

      - name: Probar validación de dirección de entrega BKL-031
        run: node --experimental-strip-types --test apps/web/src/lib/shipping-address.test.mjs

      - name: Probar cotización y checkout visual BKL-034
        run: node --experimental-strip-types --test apps/web/src/lib/checkout-ui.test.mjs

      - name: Verificar harness seguro de pruebas de carga BKL-057
        run: python3 -m unittest scripts.qa.test_load_catalog_cart

      - name: Compilar frontend de producción
        run: npm run build:web

      - name: Probar navegación en servidor de producción
        shell: bash
        run: |
          set -euo pipefail
          npm run start:web > /tmp/techstore-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true; cat /tmp/techstore-web.log' EXIT

          # Espera al servidor; si no arranca, curl devolverá error.
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ -o /dev/null; then
              break
            fi
            sleep 1
          done

          # Las rutas /aprobado y /rechazado no son evidencia de éxito:
          # deben renderizar solo el formulario hasta consultar el backend.
          for path in /pagos/resultado /pagos/resultado/aprobado /pagos/resultado/rechazado /pagos/resultado/pendiente; do
            html="$(curl --fail --silent --show-error "http://127.0.0.1:3000${path}?orderId=1&attemptId=1")"
            # En rutas estáticas Suspense puede entregar primero su fallback,
            # antes de hidratar el formulario CLIENT: no exigir su título en SSR.
            if [[ "$html" == *"El backend confirmó este pedido"* ]]; then
              echo "ERROR: resultado aprobado por URL sin autenticación"
              exit 1
            fi
            echo "HTTP 200 sin resultado no verificado: ${path}"
          done
          # BKL-043: SSR del historial no expone pedidos ni direcciones sin Bearer.
          orders_html="$(curl --fail --silent --show-error http://127.0.0.1:3000/pedidos)"
          [[ "$orders_html" == *"Mis pedidos"* ]]
          [[ "$orders_html" == *"Acceso privado"* ]]
          if [[ "$orders_html" == *"<address"* || "$orders_html" == *"Casa de entrega"* ]]; then
            echo "ERROR: la página de historial divulga PII antes de autenticar"
            exit 1
          fi
          echo "HTTP 200: /pedidos (sin datos de cliente)"
          for path in / /productos /carrito /login /checkout/entrega /checkout/revision; do
            curl --fail --silent --show-error "http://127.0.0.1:3000${path}" -o /dev/null
            echo "HTTP 200: ${path}"
          done

  api:
    name: Backend - compilar y probar Maven
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # PostgreSQL de CI, aislado y efímero; nunca usar datos reales.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: techstore_test
          POSTGRES_USER: techstore
          POSTGRES_PASSWORD: techstore_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techstore -d techstore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_TEST_URL: jdbc:postgresql://localhost:5432/techstore_test
      DB_TEST_USERNAME: techstore
      DB_TEST_PASSWORD: techstore_ci_only

    steps:
      - name: Obtener código
        uses: actions/checkout@v7

      - name: Preparar Java 21 y caché Maven
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      # Surefire: tests unitarios. Failsafe: *IT.java sobre PostgreSQL test.
      - name: Compilar backend y ejecutar pruebas unitarias e integración
        run: mvn -B -ntp -f apps/api/pom.xml clean verify

      - name: Cargar catálogo de demostración en base efímera
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps -q --filter ancestor=postgres:17-alpine | head -n 1)"
          test -n "$db_container"
          docker exec -i "$db_container" psql -U techstore -d techstore_test -v ON_ERROR_STOP=1 \
            < scripts/dev/seed-catalog.sql

      - name: Arrancar API real y comprobar endpoints HTTP
        shell: bash
        env:
          DB_URL: jdbc:postgresql://localhost:5432/techstore_test
          DB_USERNAME: techstore
          SPRING_DATASOURCE_PASSWORD: techstore_ci_only
        run: |
          set -euo pipefail
          java -jar apps/api/target/techstore-api-0.1.0-SNAPSHOT.jar \
            > /tmp/techstore-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat /tmp/techstore-api.log' EXIT

          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8080/api/health -o /dev/null; then
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "El proceso Java terminó antes de responder HTTP"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/api/health
          python3 scripts/ci/smoke-catalog.py
          python3 scripts/ci/smoke-register.py
          python3 scripts/ci/smoke-auth.py
          python3 scripts/ci/smoke-cart.py
          python3 scripts/ci/smoke-quote.py
          python3 scripts/ci/smoke-checkout.py

  e2e:
    name: E2E Chromium + Spring Boot + PostgreSQL (${{ matrix.outcome }})
    # Playwright 1.56.1 soporta Ubuntu 24.04; ubuntu-latest ya puede ser 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        outcome: [APPROVED, DECLINED]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: techstore_test
          POSTGRES_USER: techstore
          POSTGRES_PASSWORD: techstore_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techstore -d techstore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DB_URL: jdbc:postgresql://localhost:5432/techstore_test
      DB_USERNAME: techstore
      SPRING_DATASOURCE_PASSWORD: techstore_ci_only
      TECHSTORE_PAYMENT_PROVIDER: SANDBOX
      TECHSTORE_PAYMENT_SANDBOX_ENABLED: "true"
      TECHSTORE_PAYMENT_SANDBOX_OUTCOME: ${{ matrix.outcome }}
      TECHSTORE_PAYMENT_SANDBOX_AUTO_CONFIRM: "true"
      TECHSTORE_PAYMENT_WEBHOOK_ENABLED: "true"
      # Solo fixture CI; no usar este secreto fuera de la base efímera.
      TECHSTORE_PAYMENT_WEBHOOK_SECRET: e2e-ci-only-webhook-hmac-secret-0123456789
      E2E_WEBHOOK_SECRET: e2e-ci-only-webhook-hmac-secret-0123456789
      E2E_OUTCOME: ${{ matrix.outcome }}
      TECHSTORE_PAYMENT_SANDBOX_REDIRECT_ORIGIN: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CHECKOUT_RESERVATION_EXPIRY_ENABLED: "false"

    steps:
      - name: Obtener código
        uses: actions/checkout@v7

      - name: Preparar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Preparar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Compilar jar Spring Boot para E2E
        run: mvn -B -ntp -f apps/api/pom.xml -DskipTests package

      - name: Instalar frontend y Playwright fijo
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          # Exclusivamente en el job E2E; no alterar package-lock.json.
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Compilar frontend de producción
        run: npm run build:web

      - name: Ejecutar escenarios E2E con Chromium y BD aislada
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps -q --filter ancestor=postgres:17-alpine | head -n 1)"
          test -n "$db_container"
          export E2E_DB_CONTAINER="$db_container"

          java -jar apps/api/target/techstore-api-0.1.0-SNAPSHOT.jar \
            > /tmp/techstore-api-e2e.log 2>&1 &
          api_pid=$!
          npm run start:web > /tmp/techstore-web-e2e.log 2>&1 &
          web_pid=$!
          cleanup() {
            result=$?
            kill "$api_pid" "$web_pid" 2>/dev/null || true
            if [[ "$result" -ne 0 ]]; then
              echo "--- API E2E (últimas 80 líneas) ---"
              tail -n 80 /tmp/techstore-api-e2e.log || true
              echo "--- WEB E2E (últimas 80 líneas) ---"
              tail -n 80 /tmp/techstore-web-e2e.log || true
            fi
          }
          trap cleanup EXIT

          for i in {1..65}; do
            if curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/api/health >/dev/null
          for i in {1..45}; do
            if curl -fsS http://localhost:3000/pagos/sandbox >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$web_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/pagos/sandbox >/dev/null

          # Flyway ya migró una BD totalmente efímera; seed no productivo.
          docker exec -i "$db_container" psql -U techstore -d techstore_test \
            -v ON_ERROR_STOP=1 < scripts/dev/seed-catalog.sql
          node scripts/ci/e2e-accessibility.mjs
          node scripts/ci/e2e-catalog.mjs
          node scripts/ci/e2e-auth.mjs
          node scripts/ci/e2e-cart.mjs
          node scripts/ci/e2e-delivery.mjs
          node scripts/ci/e2e-checkout-visual.mjs
          node scripts/ci/e2e-checkout-payments.mjs
          # BKL-058: repetir en viewport 390px, con navegación y datos reales.
          E2E_VIEWPORT=mobile node scripts/ci/e2e-checkout-visual.mjs
          E2E_VIEWPORT=mobile node scripts/ci/e2e-checkout-payments.mjs

      - name: Guardar capturas solo ante fallo E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bkl-044-e2e-${{ matrix.outcome }}
          path: artifacts/e2e/
          if-no-files-found: ignore
          retention-days: 7
